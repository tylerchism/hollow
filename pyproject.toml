[project]
name = "hollow"
version = "0.1.0"
description = "Hollow — AI agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.3",
    "aiosqlite>=0.21.0",
    "apscheduler>=3.11.0",
    "claude-code-sdk>=0.0.25",
    "discord-py>=2.4.0",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.6",
]

[project.scripts]
hollow = "src.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]
